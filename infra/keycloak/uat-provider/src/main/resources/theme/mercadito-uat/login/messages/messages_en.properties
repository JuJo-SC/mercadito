uatInvalidCredentials=El portal UAT rechazó el acceso. Revisa tu usuario y contraseña; si el portal pide cambiarla, hazlo allí antes de volver.
uatInactiveStudent=El portal UAT indica baja, inactividad o egreso para tu programa. Consulta tu situación en el portal de alumnos.
uatUnavailable=La verificación UAT no está disponible en este momento. Inténtalo de nuevo más tarde.
uatPreparing=El acceso UAT está en preparación. Vuelve cuando se habilite la verificación.
uatConsentRequired=Confirma que aceptas la verificación indicada para continuar.
uatNotAllowed=Este acceso no está habilitado para la prueba UAT.
uatInvalidUsername=Escribe tu matrícula (solo números) o tu correo de alumnos UAT.
uatInvalidPassword=Escribe la contraseña de tu cuenta del portal UAT.

uatUnconfirmedStatus=El portal UAT validó tu cuenta, pero no pudimos confirmar que tu programa permita el acceso. Consulta tu situación allí.
