name: scrap-uat-service
services:
  scrap-uat-service:
    build:
      context: /srv/apps/scrap-uat-service
    image: scrap-uat-service:b3b1c7adcbf76e08ee16b030b0702a8e8ecb14b1
    container_name: scrap-uat-service
    restart: unless-stopped
    init: true
    env_file:
      - /srv/secrets/scrap-uat-service/service.env
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - uat-verification
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  uat-verification:
    name: uat-verification
    external: true
