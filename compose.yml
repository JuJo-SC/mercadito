name: mercadito
services:
  database:
    image: postgres:17-alpine
    container_name: mercadito-database
    restart: unless-stopped
    env_file:
      - /srv/secrets/mercadito/database.env
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    shm_size: 256mb
    mem_limit: 2g
    networks:
      - private

  keycloak:
    build:
      context: .
      dockerfile: keycloak.Dockerfile
    image: mercadito-keycloak:26.7.4
    container_name: mercadito-keycloak
    restart: unless-stopped
    env_file:
      - /srv/secrets/mercadito/keycloak.env
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: 2g
    networks:
      - private
      - edge

  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: migrator
    image: mercadito-migrator:latest
    restart: "no"
    env_file:
      - /srv/secrets/mercadito/app.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    image: mercadito-web:latest
    container_name: mercadito-web
    restart: unless-stopped
    env_file:
      - /srv/secrets/mercadito/app.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    networks:
      - private
      - edge

volumes:
  database_data:
    name: mercadito_database_data

networks:
  private:
    driver: bridge
  edge:
    external: true
